apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ .Release.Name }}-eds}
spec:
  replicas: {{ .Values.replicaCount }}
  selector: {matchLabels: {app: {{ .Release.Name }}-eds}}
  template:
    metadata: {labels: {app: {{ .Release.Name }}-eds}}
    spec:
      containers:
        - name: eds
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports: [{containerPort: 8080}]
          resources: {{- toYaml .Values.resources | nindent 12 }}
