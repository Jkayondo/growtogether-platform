apiVersion: apps/v1
kind: Deployment
metadata: {name: gt-eds}
spec:
  replicas: 2
  selector: {matchLabels: {app: gt-eds}}
  template:
    metadata: {labels: {app: gt-eds}}
    spec:
      securityContext: {runAsNonRoot: true}
      containers:
        - name: eds
          image: ghcr.io/growtogether/growtogether-platform:0.30.0
          ports: [{containerPort: 8080}]
          envFrom: [{configMapRef: {name: gt-eds-config}}, {secretRef: {name: gt-eds-secrets}}]
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: 8080}, initialDelaySeconds: 20, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: 8080}, initialDelaySeconds: 40, periodSeconds: 15}
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "1", memory: 1Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: gt-eds}
spec: {selector: {app: gt-eds}, ports: [{port: 80, targetPort: 8080}]}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: gt-eds}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: gt-eds}
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
