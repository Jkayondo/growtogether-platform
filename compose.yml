services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: growtogether
      POSTGRES_USER: growtogether
      POSTGRES_PASSWORD: growtogether
    ports: ["5432:5432"]
    volumes: ["gt_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growtogether -d growtogether"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    environment:
      GT_DB_URL: jdbc:postgresql://postgres:5432/growtogether
      GT_DB_USER: growtogether
      GT_DB_PASSWORD: growtogether
      GT_REDIS_HOST: redis
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
volumes:
  gt_postgres:
